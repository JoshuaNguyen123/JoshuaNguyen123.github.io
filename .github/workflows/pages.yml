name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pr-verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Job-level so the smoke step sees them too and can assert the contact form
    # actually shipped. Every value here is a public repository variable.
    env:
      NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
      NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run public-safety:check
      - run: npm test
      - name: Build secret-free static export
        run: npm run build
        env:
          GITHUB_USERNAME: JoshuaNguyen123
      - run: npm run privacy:check
      - run: npm run smoke

  build:
    if: github.event_name != 'pull_request'
    # Only the deploy job needs Pages write; this one just uploads an artifact.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL }}
      NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run public-safety:check
      - run: npm test
      - name: Build privacy-validated static export
        run: npm run build
        env:
          # NOT the Actions bot token. GitHub buckets contribution days by the
          # requesting account's timezone, so the bot token (UTC) shifted days
          # across midnight relative to the collector's feed (America/Denver),
          # which made the summary tiles jump on page load. When this optional
          # secret is absent the build falls back to the committed
          # data/github-activity.json cache, which is written locally with the
          # owner's token and therefore already matches the feed.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_GITHUB_TOKEN }}
          GITHUB_USERNAME: JoshuaNguyen123
          CURSOR_ADMIN_API_KEY: ${{ secrets.CURSOR_ADMIN_API_KEY }}
      - run: npm run privacy:check
      - run: npm run smoke
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
