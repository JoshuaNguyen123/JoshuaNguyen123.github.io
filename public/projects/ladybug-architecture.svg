<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="ladybug-title ladybug-desc">
  <title id="ladybug-title">Ladybug architecture</title>
  <desc id="ladybug-desc">One shared space for two people, built on three hosts: a deterministic dual-phone simulator, a Supabase PWA with row-level security, private storage, and realtime state, and the earlier SwiftUI and Firebase app. Self-hosted CI checks migrations, a three-account journey, Chromium runs, and the iOS handoff.</desc>
