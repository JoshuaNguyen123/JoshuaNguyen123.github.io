name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run public-safety:check
      - run: npm test
      - name: Build privacy-validated static export
        run: npm run build
        env:
          # NOT the Actions bot token. GitHub buckets contribution days by the
          # requesting account's timezone, so the bot token (UTC) shifted days
          # across midnight relative to the collector's feed (America/Denver),
          # which made the summary tiles jump on page load. When this optional
          # secret is absent the build falls back to the committed
          # data/github-activity.json cache, which is written locally with the
          # owner's token and therefore already matches the feed.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_GITHUB_TOKEN }}
          GITHUB_USERNAME: JoshuaNguyen123
          CURSOR_ADMIN_API_KEY: ${{ secrets.CURSOR_ADMIN_API_KEY }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
      - run: npm run privacy:check
      - run: npm run smoke
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
