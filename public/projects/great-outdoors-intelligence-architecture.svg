<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Great Outdoors Intelligence architecture</title>
  <desc id="desc">Live condition feeds are scored per activity and turned into a ranked list of destinations. A dashboard exists so a person can argue with the ranking. Offline trip bundles are a separate output from the same scores.</desc>
  <rect width="1200" height="900" fill="#f5f3ed"/>
  <text x="72" y="86" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="3">08  RANK THE DAY</text>
  <rect x="72" y="118" width="1056" height="88" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="600" y="156" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Live feeds</text>
  <text x="600" y="186" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">forecast, rivers, avalanche, snow, roads, fire</text>
  <rect x="72" y="286" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="232" y="369" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Score per activity</text>
  <rect x="440" y="286" width="320" height="150" fill="#fffdf8" stroke="#8a5a20" stroke-width="2.5"/>
  <text x="600" y="369" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Ranked destinations</text>
  <rect x="808" y="286" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="968" y="354" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Dashboard</text>
  <text x="968" y="392" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">to argue with</text>
  <rect x="440" y="536" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="600" y="619" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Offline trip bundles</text>
  <path d="M600 206 v64" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M392 361 h48" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M760 361 h48" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M600 436 v100" fill="none" stroke="#6b6455" stroke-width="2"/>
  <text x="72" y="778" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="20">The product is the ranking.</text>
</svg>
