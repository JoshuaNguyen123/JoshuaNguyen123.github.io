<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Local-First Meeting Transcription architecture</title>
  <desc id="desc">Local audio produces a live transcript and a refined transcript. A review queue reconciles the two into agreed text, then a local model writes notes.</desc>
  <rect width="1200" height="900" fill="#f5f3ed"/>
  <text x="72" y="86" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="3">09  STAY LOCAL</text>
  <rect x="72" y="118" width="1056" height="88" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="600" y="172" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Local audio</text>
  <rect x="72" y="286" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="232" y="354" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Live transcript</text>
  <text x="232" y="392" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">Vosk</text>
  <rect x="440" y="286" width="320" height="150" fill="#fffdf8" stroke="#8a5a20" stroke-width="2.5"/>
  <text x="600" y="369" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Review queue</text>
  <rect x="808" y="286" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="968" y="354" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Refined transcript</text>
  <text x="968" y="392" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">faster-whisper</text>
  <rect x="440" y="536" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="600" y="619" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Agreed text</text>
  <rect x="808" y="536" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="968" y="619" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Local notes model</text>
  <path d="M600 206 v64" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M392 361 h48" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M760 361 h48" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M600 436 v100" fill="none" stroke="#6b6455" stroke-width="2"/>
  <path d="M760 611 h48" fill="none" stroke="#6b6455" stroke-width="2"/>
  <text x="72" y="778" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="20">Two transcripts disagree. The queue is the product.</text>
</svg>
