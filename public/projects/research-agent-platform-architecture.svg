<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="rap-title rap-desc">
  <title id="rap-title">Research Agent Platform architecture</title>
  <desc id="rap-desc">A standalone Electron desktop editor over an ordinary vault folder. A file tree and CodeMirror note sit beside a hunk-review gate that must accept or reject edits before anything touches disk. Three pin connectors join the window to a vendored agent core at a pinned commit.</desc>

  <defs>
    <clipPath id="rap-window-clip">
      <rect x="48" y="36" width="1104" height="708" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="#f5f3ed"/>

  <!-- Desktop window chrome -->
  <g id="rap-window">
    <rect x="48" y="36" width="1104" height="708" rx="14" fill="#fffdf8" stroke="#16130e" stroke-width="4"/>
    <rect x="48" y="36" width="1104" height="56" rx="14" fill="#16130e"/>
    <rect x="48" y="78" width="1104" height="14" fill="#16130e"/>
    <circle cx="80" cy="64" r="9" fill="#8a2f1f"/>
    <circle cx="106" cy="64" r="9" fill="#8a5a20"/>
    <circle cx="132" cy="64" r="9" fill="#3f6135"/>
    <text x="600" y="70" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="24">vault / notes</text>

    <g clip-path="url(#rap-window-clip)">
      <!-- File tree -->
      <rect x="48" y="92" width="248" height="652" fill="#f5f3ed"/>
      <line x1="296" y1="92" x2="296" y2="744" stroke="#e0d9cc" stroke-width="2"/>
      <text x="72" y="136" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="20">▾ vault</text>
      <rect x="68" y="156" width="204" height="44" rx="6" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
      <text x="84" y="186" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">mission.md</text>
      <text x="84" y="236" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">sources.md</text>
      <text x="84" y="280" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">plan.md</text>
      <text x="84" y="324" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">inbox.md</text>
      <text x="72" y="380" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="20">▾ notes</text>
      <text x="84" y="424" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">q3.md</text>
      <text x="84" y="468" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">daily.md</text>
      <rect x="68" y="660" width="204" height="52" rx="8" fill="#16130e"/>
      <text x="170" y="694" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="18">.exe · Playwright</text>

      <!-- CodeMirror-like editor -->
      <rect x="296" y="92" width="456" height="652" fill="#fffdf8"/>
      <rect x="296" y="92" width="56" height="652" fill="#f5f3ed"/>
      <text x="324" y="150" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">1</text>
      <text x="324" y="198" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">2</text>
      <text x="324" y="246" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">3</text>
      <text x="324" y="294" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">4</text>
      <text x="324" y="342" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">5</text>
      <text x="372" y="150" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="26"># Mission</text>
      <text x="372" y="198" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">Read the vault.</text>
      <rect x="352" y="214" width="384" height="44" fill="#e0d9cc"/>
      <text x="372" y="246" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">Cite every claim.</text>
      <text x="372" y="294" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">- [[sources]]</text>
      <text x="372" y="342" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="22">- [[plan]]</text>
      <rect x="548" y="220" width="3" height="32" fill="#8a5a20"/>

      <!-- Hunk review gate -->
      <rect x="752" y="92" width="400" height="652" fill="#fffdf8"/>
      <line x1="752" y1="92" x2="752" y2="744" stroke="#8a5a20" stroke-width="6"/>
      <rect x="752" y="92" width="400" height="64" fill="#8a5a20"/>
      <text x="952" y="134" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="26">REVIEW  ·  before disk</text>
      <text x="776" y="192" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="20">mission.md</text>
      <rect x="776" y="214" width="352" height="56" rx="6" fill="#f5f3ed"/>
      <text x="792" y="252" fill="#8a2f1f" font-family="Georgia, 'Times New Roman', serif" font-size="24">− no source</text>
      <rect x="776" y="282" width="352" height="56" rx="6" fill="#f5f3ed"/>
      <text x="792" y="320" fill="#3f6135" font-family="Georgia, 'Times New Roman', serif" font-size="24">+ cited [[q3]]</text>
      <rect x="776" y="354" width="352" height="48" rx="6" fill="#f5f3ed"/>
      <text x="792" y="386" fill="#8a2f1f" font-family="Georgia, 'Times New Roman', serif" font-size="22">− inbox dump</text>
      <rect x="776" y="414" width="352" height="48" rx="6" fill="#f5f3ed"/>
      <text x="792" y="446" fill="#3f6135" font-family="Georgia, 'Times New Roman', serif" font-size="22">+ filed under plan</text>
      <rect x="776" y="640" width="160" height="56" rx="8" fill="#fffdf8" stroke="#8a2f1f" stroke-width="3"/>
      <text x="856" y="676" text-anchor="middle" fill="#8a2f1f" font-family="Georgia, 'Times New Roman', serif" font-size="22">Reject</text>
      <rect x="952" y="640" width="176" height="56" rx="8" fill="#3f6135"/>
      <text x="1040" y="676" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="22">Accept</text>
    </g>
  </g>

  <!-- Three typed seams as pins into the vendored core -->
  <g id="rap-seams">
    <line x1="248" y1="744" x2="248" y2="792" stroke="#16130e" stroke-width="4"/>
    <line x1="524" y1="744" x2="524" y2="792" stroke="#16130e" stroke-width="4"/>
    <line x1="952" y1="744" x2="952" y2="792" stroke="#16130e" stroke-width="4"/>
    <circle cx="248" cy="792" r="11" fill="#16130e"/>
    <circle cx="524" cy="792" r="11" fill="#16130e"/>
    <circle cx="952" cy="792" r="11" fill="#16130e"/>
    <rect x="48" y="802" width="1104" height="70" rx="10" fill="#16130e"/>
    <text x="80" y="848" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="26">vendored core  @  pinned commit</text>
    <text x="1132" y="848" text-anchor="end" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">tools · vault · edits</text>
  </g>
</svg>
