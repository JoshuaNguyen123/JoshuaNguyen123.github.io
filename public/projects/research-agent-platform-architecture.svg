<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="research-agent-platform-title research-agent-platform-desc">
  <title id="research-agent-platform-title">Research Agent Platform architecture</title>
  <desc id="research-agent-platform-desc">A standalone desktop editor around the same agent core as the Obsidian plugin. The core is vendored at a pinned commit and reached through three typed seams. The Electron and CodeMirror 6 host owns the file tree, hunk-by-hunk review, and the Windows installer. Approved edits are written as ordinary notes, so Obsidian can open the same vault. Playwright journeys cover the whole loop.</desc>
