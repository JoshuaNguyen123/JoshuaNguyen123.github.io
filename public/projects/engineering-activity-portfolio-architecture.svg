<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="eap-title eap-desc">
  <title id="eap-title">Engineering Activity Portfolio architecture</title>
  <desc id="eap-desc">Machine-local collectors reduce activity to dates and counts only. A hard privacy filter blocks prompts, code, filenames, repositories, and raw IDs. The public site reads a published snapshot for heatmaps, a live feed poll, and /activity definitions.</desc>
  <rect width="1200" height="900" fill="#f5f3ed"/>

  <text x="56" y="52" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3">07  DATES ONLY</text>
  <text x="56" y="88" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Privacy-first activity pipeline</text>
  <text x="56" y="116" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="16">Local tools → reduce → publish snapshot → public site. The calendar is public; the work is not.</text>

  <!-- LEFT ZONE: machine-local -->
  <rect x="40" y="148" width="430" height="580" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <rect x="40" y="148" width="430" height="42" fill="#16130e"/>
  <text x="255" y="176" text-anchor="middle" fill="#f5f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="2">MACHINE-LOCAL</text>

  <text x="60" y="220" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2">1  COLLECTORS</text>
  <rect x="60" y="232" width="390" height="130" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="78" y="260" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="17">Read activity from tools I work in</text>
  <text x="78" y="286" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">• editor / IDE session signals</text>
  <text x="78" y="308" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">• agent / chat tool events</text>
  <text x="78" y="330" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">• build / deploy day markers</text>
  <text x="78" y="348" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">Raw detail stays on disk — never the publish payload</text>

  <text x="60" y="396" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2">2  REDUCE</text>
  <rect x="60" y="408" width="390" height="100" fill="#f5f3ed" stroke="#8a5a20" stroke-width="2"/>
  <text x="78" y="438" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="17">Collapse to dates + daily counts</text>
  <text x="78" y="464" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Emit only: YYYY-MM-DD · count per source</text>
  <text x="78" y="488" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="13">Honest product = observed days, not a work feed</text>

  <text x="60" y="544" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2">3  PUBLISH STEP</text>
  <rect x="60" y="556" width="390" height="88" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="78" y="586" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="17">Write public aggregate snapshot</text>
  <text x="78" y="612" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Static JSON / feed the site can poll</text>
  <text x="78" y="632" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="12">No project names · no paths · no prompts</text>

  <path d="M255 362 v46" fill="none" stroke="#6b6455" stroke-width="1.5"/>
  <path d="M255 508 v48" fill="none" stroke="#6b6455" stroke-width="1.5"/>

  <!-- CENTER: privacy gate -->
  <rect x="490" y="148" width="200" height="580" fill="#16130e"/>
  <text x="590" y="220" text-anchor="middle" fill="#f5f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="2">PRIVACY FILTER</text>
  <text x="590" y="250" text-anchor="middle" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="13">hard gate</text>
  <line x1="520" y1="270" x2="660" y2="270" stroke="#8a5a20" stroke-width="1"/>

  <text x="590" y="310" text-anchor="middle" fill="#f5f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="13">NEVER enters</text>
  <text x="590" y="330" text-anchor="middle" fill="#f5f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="13">the snapshot:</text>

  <text x="590" y="372" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">prompts</text>
  <text x="590" y="400" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">code</text>
  <text x="590" y="428" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">filenames</text>
  <text x="590" y="456" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">repositories</text>
  <text x="590" y="484" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">raw IDs</text>
  <text x="590" y="512" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">project names</text>
  <text x="590" y="540" text-anchor="middle" fill="#c4b8a4" font-family="Georgia, 'Times New Roman', serif" font-size="15">paths</text>

  <line x1="520" y1="568" x2="660" y2="568" stroke="#8a5a20" stroke-width="1"/>
  <text x="590" y="600" text-anchor="middle" fill="#f5f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="13">PASSES:</text>
  <text x="590" y="628" text-anchor="middle" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="15">dates</text>
  <text x="590" y="656" text-anchor="middle" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="15">+ counts</text>
  <text x="590" y="690" text-anchor="middle" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="11">privacy is the product</text>

  <!-- flow arrows through gate -->
  <path d="M470 600 h20" fill="none" stroke="#8a5a20" stroke-width="2"/>
  <path d="M690 600 h20" fill="none" stroke="#8a5a20" stroke-width="2"/>

  <!-- RIGHT ZONE: public site -->
  <rect x="710" y="148" width="450" height="580" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <line x1="710" y1="190" x2="1160" y2="190" stroke="#16130e" stroke-width="1.5"/>
  <text x="935" y="176" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="2">PUBLIC SITE</text>

  <text x="730" y="220" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2">4  PUBLISHED SNAPSHOT</text>
  <rect x="730" y="232" width="410" height="72" fill="#f5f3ed" stroke="#8a5a20" stroke-width="2"/>
  <text x="748" y="262" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="16">Aggregate feed of daily counts</text>
  <text x="748" y="286" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Readable by the static homepage</text>

  <text x="730" y="340" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2">5  HOMEPAGE CONSUMERS</text>
  <rect x="730" y="352" width="195" height="150" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="828" y="390" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="16">Yearly heatmaps</text>
  <text x="828" y="418" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">activity over time</text>
  <text x="828" y="444" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">one cell = one day</text>
  <text x="828" y="470" text-anchor="middle" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="12">intensity = count</text>

  <rect x="945" y="352" width="195" height="150" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="1042" y="390" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="16">Live feed poll</text>
  <text x="1042" y="418" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">refresh for a</text>
  <text x="1042" y="442" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">newer day</text>
  <text x="1042" y="470" text-anchor="middle" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="12">no content leak</text>

  <path d="M935 304 v48" fill="none" stroke="#6b6455" stroke-width="1.5"/>
  <path d="M828 304 v48" fill="none" stroke="#6b6455" stroke-width="1.5" opacity="0.4"/>
  <path d="M1042 304 v48" fill="none" stroke="#6b6455" stroke-width="1.5" opacity="0.4"/>

  <text x="730" y="540" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2">6  /ACTIVITY</text>
  <rect x="730" y="552" width="410" height="140" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="748" y="584" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="16">Definitions &amp; exclusions page</text>
  <text x="748" y="612" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">• what each number counts</text>
  <text x="748" y="636" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">• what each number leaves out</text>
  <text x="748" y="660" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">• provenance as a visible feature</text>
  <text x="748" y="680" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="12">Not a footnote under a revealing chart</text>

  <!-- footer -->
  <text x="56" y="780" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="16">The tempting dashboard is a feed of what I worked on.</text>
  <text x="56" y="808" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="16">The honest one is a calendar of observed days — privacy as the product, not a disclaimer.</text>
  <text x="56" y="850" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="14">TypeScript · Data visualization · this site</text>
</svg>
