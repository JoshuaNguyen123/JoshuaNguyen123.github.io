  <title id="obsidian-research-agent-title">Obsidian Research Agent architecture</title>
  <desc id="obsidian-research-agent-desc">A mission starts in the console, reads the vault, and becomes a durable plan. Tools run in a sandbox only after an approval gate, and results are written back as sourced notes with a receipt per step. The companion service, Linear, and GitHub sit behind capability gates, off the default path.</desc>
