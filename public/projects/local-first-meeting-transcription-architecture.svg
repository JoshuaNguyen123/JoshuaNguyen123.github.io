  <text x="468" y="518" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Refined pass</text>
  <text x="468" y="552" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">faster-whisper</text>
