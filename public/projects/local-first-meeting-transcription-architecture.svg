<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="local-first-meeting-transcription-title local-first-meeting-transcription-desc">
  <title id="local-first-meeting-transcription-title">Local-First Meeting Transcription architecture</title>
  <desc id="local-first-meeting-transcription-desc">Everything runs on the machine. The recorder keeps audio on disk. Vosk writes a live transcript during the meeting and faster-whisper writes a refined one afterward. A review queue reconciles the two, and only the agreed text goes to a local model that writes structured notes. FastAPI serves the backend and React the review UI.</desc>
