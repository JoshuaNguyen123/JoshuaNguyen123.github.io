  <text x="600" y="642" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="18">safe practice</text>
  <rect x="808" y="536" width="320" height="150" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <text x="968" y="604" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Replay check</text>
