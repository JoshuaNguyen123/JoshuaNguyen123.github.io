<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="teach-anything-title teach-anything-desc">
  <title id="teach-anything-title">Teach Anything architecture</title>
  <desc id="teach-anything-desc">A deterministic learning loop. Learning history updates a memory model built on FSRS-5 forgetting curves and Bayesian mastery. Memory drives the scheduler, which picks the next session. Sessions ask source-cited questions and run code exercises in a sandbox, and the answers feed back into history. The same history always produces the same plan.</desc>
