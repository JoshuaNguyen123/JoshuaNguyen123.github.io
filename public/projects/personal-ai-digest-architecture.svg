<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="personal-ai-digest-title personal-ai-digest-desc">
  <title id="personal-ai-digest-title">Personal AI Digest architecture</title>
  <desc id="personal-ai-digest-desc">Two services that share only a knowledge store. Ingest collects sources and writes to SQLite or Postgres with pgvector. Delivery, fired by a Cloudflare Worker, retrieves from the store, generates a lesson with a citation for every sentence, and emails it twice a day. Either service can fail without stopping the other.</desc>
  <rect width="1200" height="900" fill="#ffffff"/>
  <rect x="40" y="60" width="360" height="470" fill="none" stroke="#c4c4c4" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="62" y="96" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">Ingest service</text>
  <rect x="800" y="60" width="360" height="780" fill="none" stroke="#c4c4c4" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="822" y="96" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">Delivery service</text>
  <path d="M 220 247 L 220 363" fill="none" stroke="#141414" stroke-width="2"/>
  <path d="M 220 363 L 213 349 L 227 349 Z" fill="#141414"/>
  <path d="M 370 420 L 480 420" fill="none" stroke="#2f4bd6" stroke-width="3"/>
  <path d="M 480 420 L 466 427 L 466 413 Z" fill="#2f4bd6"/>
  <rect x="380.2" y="403" width="89.6" height="34" fill="#ffffff"/>
  <text x="425" y="426" text-anchor="middle" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">writes</text>
  <path d="M 720 420 L 830 420" fill="none" stroke="#2f4bd6" stroke-width="3"/>
  <path d="M 830 420 L 816 427 L 816 413 Z" fill="#2f4bd6"/>
  <rect x="736" y="403" width="78" height="34" fill="#ffffff"/>
  <text x="775" y="426" text-anchor="middle" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">reads</text>
  <path d="M 980 247 L 980 363" fill="none" stroke="#141414" stroke-width="2"/>
  <path d="M 980 363 L 973 349 L 987 349 Z" fill="#141414"/>
  <rect x="941" y="288" width="78" height="34" fill="#ffffff"/>
  <text x="980" y="311" text-anchor="middle" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">fires</text>
  <path d="M 980 477 L 980 543" fill="none" stroke="#2f4bd6" stroke-width="3"/>
  <path d="M 980 543 L 973 529 L 987 529 Z" fill="#2f4bd6"/>
  <path d="M 980 657 L 980 728" fill="none" stroke="#2f4bd6" stroke-width="3"/>
  <path d="M 980 728 L 973 714 L 987 714 Z" fill="#2f4bd6"/>
  <rect x="70" y="133" width="300" height="114" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="98" y="183" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Sources</text>
  <text x="98" y="217" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">reading, notes</text>
  <rect x="70" y="363" width="300" height="114" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="98" y="413" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Ingest</text>
  <text x="98" y="447" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">chunk, embed</text>
  <rect x="480" y="348" width="240" height="144" fill="#ffffff" stroke="#2f4bd6" stroke-width="3"/>
  <text x="508" y="398" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Knowledge</text>
  <text x="508" y="432" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">SQLite or</text>
  <text x="508" y="462" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">pgvector</text>
  <rect x="830" y="133" width="300" height="114" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="858" y="183" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Worker cron</text>
  <text x="858" y="217" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">Cloudflare</text>
  <rect x="830" y="363" width="300" height="114" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="858" y="413" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Retrieve</text>
  <text x="858" y="447" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">from the store</text>
  <rect x="830" y="543" width="300" height="114" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="858" y="593" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Generate</text>
  <text x="858" y="627" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">cite every line</text>
  <rect x="830" y="728" width="300" height="84" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="858" y="778" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Email, 2x daily</text>
  <text x="60" y="640" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">The services share only the store.</text>
  <text x="60" y="670" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">If ingest stalls, mail still goes</text>
  <text x="60" y="700" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">out from what is indexed.</text>
</svg>
