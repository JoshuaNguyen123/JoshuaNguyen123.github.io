<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="goi-title goi-desc">
  <title id="goi-title">Great Outdoors Intelligence — Montana places ranked for today</title>
  <desc id="goi-desc">A Montana mountain and river landscape with three ranked destinations for today. Live condition marks sit on the land. A list overlay scores North Fork, Ridge Lake, and West Bench. A folded offline bundle sits at the trailhead.</desc>
