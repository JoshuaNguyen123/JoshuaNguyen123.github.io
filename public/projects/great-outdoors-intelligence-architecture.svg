<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="great-outdoors-intelligence-title great-outdoors-intelligence-desc">
  <title id="great-outdoors-intelligence-title">Great Outdoors Intelligence architecture</title>
  <desc id="great-outdoors-intelligence-desc">Condition feeds (forecasts, river gauges, avalanche advisories, snowpack, road status, and fire data) are ingested and scored per activity. The scores feed a dashboard where a person can question the ranking, and separately produce trip bundles that work fully offline. Built on the autonomous repository template; in progress.</desc>
