<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Teach Anything architecture</title>
  <desc id="desc">Learning history updates memory. A scheduler serves cited questions and sandboxed exercises. A replay check makes Tuesday depend on Monday.</desc>
