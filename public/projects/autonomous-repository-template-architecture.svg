<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">Autonomous Repository Template architecture</title>
  <desc id="art-desc">A repository drawn as a manila folder: a human-request ticket enters at the top, PLAN.md and tracked memory files sit above a heavy planning gate, and the src folder is locked until the plan is approved. A verification lane of pass marks sits under implementation. Protocol versions can migrate without losing state.</desc>

  <defs>
    <pattern id="art-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#8a5a20" stroke-width="5"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#f5f3ed"/>

  <!-- Human request ticket -->
  <g id="art-request" transform="rotate(-3 250 100)">
    <rect x="80" y="40" width="340" height="120" rx="8" fill="#fffdf8" stroke="#16130e" stroke-width="3"/>
    <rect x="80" y="40" width="24" height="120" rx="4" fill="#8a5a20"/>
    <text x="124" y="88" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="22">HUMAN REQUEST</text>
    <text x="124" y="132" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="30">Add the verify lane</text>
  </g>

  <!-- Manila repo folder with a file tree inside -->
  <g id="art-repo">
    <path d="M 56 188 H 300 L 340 232 H 800 V 872 H 56 Z" fill="#fffdf8" stroke="#16130e" stroke-width="4"/>
    <text x="84" y="222" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="24">repo</text>

    <!-- Tree spine -->
    <path d="M 108 280 V 500" fill="none" stroke="#16130e" stroke-width="4"/>
    <path d="M 108 310 H 148" fill="none" stroke="#16130e" stroke-width="4"/>
    <path d="M 108 430 H 148" fill="none" stroke="#16130e" stroke-width="4"/>

    <!-- PLAN.md sheet -->
    <rect x="148" y="256" width="280" height="140" fill="#fffdf8" stroke="#16130e" stroke-width="3"/>
    <rect x="148" y="256" width="280" height="40" fill="#16130e"/>
    <text x="164" y="284" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="24">PLAN.md</text>
    <rect x="164" y="316" width="200" height="8" fill="#e0d9cc"/>
    <rect x="164" y="336" width="168" height="8" fill="#e0d9cc"/>
    <rect x="164" y="356" width="220" height="8" fill="#e0d9cc"/>

    <!-- Memory folder + files -->
    <path d="M 148 412 H 220 L 242 436 H 420 V 500 H 148 Z" fill="#f5f3ed" stroke="#16130e" stroke-width="3"/>
    <text x="164" y="476" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="24">memory/</text>
    <rect x="448" y="412" width="200" height="48" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
    <text x="464" y="444" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">STATE.md</text>
    <rect x="448" y="468" width="200" height="48" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
    <text x="464" y="500" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">DECISIONS.md</text>

    <!-- Locked src folder, behind the gate -->
    <path d="M 148 620 H 236 L 260 648 H 560 V 760 H 148 Z" fill="#fffdf8" stroke="#16130e" stroke-width="3"/>
    <path d="M 148 620 H 236 L 260 648 H 560 V 760 H 148 Z" fill="url(#art-hatch)" opacity="0.55"/>
    <text x="280" y="714" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="40">src/</text>

    <!-- Verification lane -->
    <rect x="80" y="788" width="696" height="64" rx="8" fill="#f5f3ed" stroke="#3f6135" stroke-width="3"/>
    <text x="108" y="830" fill="#3f6135" font-family="Georgia, 'Times New Roman', serif" font-size="26">verify</text>
    <circle cx="268" cy="820" r="18" fill="#3f6135"/>
    <path d="M 258 820 L 266 828 L 280 810" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="336" cy="820" r="18" fill="#3f6135"/>
    <path d="M 326 820 L 334 828 L 348 810" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="404" cy="820" r="18" fill="#3f6135"/>
    <path d="M 394 820 L 402 828 L 416 810" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Barrier across plan → implement, lock on the door -->
  <g id="art-gate">
    <rect x="64" y="528" width="752" height="80" rx="6" fill="#8a5a20" transform="rotate(-1.5 440 568)"/>
    <text x="120" y="584" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="48" transform="rotate(-1.5 440 568)">GATE</text>
    <path d="M 792 478 V 400 A 82 82 0 0 1 956 400 V 478" fill="none" stroke="#16130e" stroke-width="28" stroke-linecap="round"/>
    <rect x="740" y="466" width="268" height="280" rx="28" fill="#8a5a20" stroke="#16130e" stroke-width="6"/>
    <circle cx="874" cy="572" r="30" fill="#16130e"/>
    <rect x="856" y="572" width="36" height="78" rx="6" fill="#16130e"/>
    <text x="874" y="704" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="30">LOCKED</text>
  </g>

  <rect x="816" y="788" width="308" height="64" rx="8" fill="#fffdf8" stroke="#16130e" stroke-width="3"/>
  <text x="970" y="830" text-anchor="middle" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">v3 → v4  ·  state kept</text>
</svg>
