  <text x="108" y="407" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">audio on disk</text>
  <rect x="440" y="163" width="320" height="114" fill="#ffffff" stroke="#141414" stroke-width="2"/>
  <text x="468" y="213" fill="#141414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Live pass</text>
  <text x="468" y="247" fill="#5c5c5c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">Vosk · during</text>
