<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="ta-title ta-desc">
  <title id="ta-title">Teach Anything architecture</title>
  <desc id="ta-desc">A study session that remembers: a stack of source-cited question cards, an FSRS-5 forgetting curve with review marks, a Monday-to-Tuesday calendar scheduled from memory, and a sandboxed code exercise chip. Tuesday is planned from what Monday taught.</desc>

  <defs>
    <filter id="ta-shadow" x="-8%" y="-6%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#16130e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#f5f3ed"/>

  <!-- FSRS-5 forgetting curve (right): decay with two review recoveries -->
  <g id="ta-curve" fill="none">
    <path d="M 668 86 V 548 H 1154" stroke="#e0d9cc" stroke-width="3"/>
    <path d="M 700 156
             C 780 190, 840 250, 880 300
             C 940 370, 1000 430, 1144 500"
          stroke="#8a5a20" stroke-width="10" stroke-linecap="round"/>
  </g>
  <circle cx="700" cy="156" r="13" fill="#8a5a20"/>
  <circle cx="880" cy="300" r="14" fill="#fffdf8" stroke="#8a5a20" stroke-width="5"/>
  <circle cx="1006" cy="420" r="14" fill="#fffdf8" stroke="#8a5a20" stroke-width="5"/>
  <circle cx="1144" cy="500" r="13" fill="#8a5a20"/>
  <text x="784" y="108" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="42">FSRS-5</text>

  <!-- Stair-step card stack: left/top edges must read at tile size -->
  <g id="ta-cards">
    <rect x="40" y="72" width="500" height="620" rx="18" fill="#e0d9cc" stroke="#6b6455" stroke-width="3"/>
    <rect x="88" y="110" width="510" height="624" rx="18" fill="#fffdf8" stroke="#6b6455" stroke-width="3"/>
    <g filter="url(#ta-shadow)">
      <rect x="136" y="148" width="520" height="628" rx="18" fill="#fffdf8" stroke="#16130e" stroke-width="4"/>
      <text x="168" y="214" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="28">Q</text>
      <text x="168" y="320" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="48">What did Monday</text>
      <text x="168" y="384" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="48">actually teach?</text>
      <rect x="168" y="430" width="440" height="4" fill="#e0d9cc"/>
      <rect x="152" y="640" width="472" height="88" rx="10" fill="#f5f3ed" stroke="#8a5a20" stroke-width="2"/>
      <text x="176" y="678" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="20">src</text>
      <text x="176" y="712" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="28">Karpicke 2008</text>
    </g>
  </g>

  <!-- Sandboxed terminal chip — not a column -->
  <g id="ta-sandbox">
    <rect x="168" y="468" width="248" height="88" rx="10" fill="#16130e"/>
    <text x="188" y="506" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="22">&gt; sandbox</text>
    <text x="188" y="538" fill="#3f6135" font-family="Georgia, 'Times New Roman', serif" font-size="22">ok · cited</text>
  </g>

  <!-- Monday → Tuesday scheduled from memory -->
  <g id="ta-calendar">
    <rect x="668" y="600" width="486" height="220" rx="16" fill="#fffdf8" stroke="#16130e" stroke-width="3"/>
    <text x="692" y="648" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="22">from memory</text>
    <rect x="692" y="672" width="132" height="112" rx="10" fill="#f5f3ed" stroke="#e0d9cc" stroke-width="2"/>
    <text x="758" y="718" text-anchor="middle" fill="#3a352c" font-family="Georgia, 'Times New Roman', serif" font-size="28">Mon</text>
    <text x="758" y="758" text-anchor="middle" fill="#3f6135" font-family="Georgia, 'Times New Roman', serif" font-size="24">done</text>
    <path d="M 836 728 H 872" stroke="#8a5a20" stroke-width="5" stroke-linecap="round"/>
    <path d="M 860 716 L 878 728 L 860 740" fill="none" stroke="#8a5a20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="890" y="672" width="132" height="112" rx="10" fill="#8a5a20"/>
    <text x="956" y="718" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="28">Tue</text>
    <text x="956" y="758" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="24">due</text>
    <rect x="1034" y="672" width="92" height="112" rx="10" fill="#f5f3ed" stroke="#e0d9cc" stroke-width="2"/>
    <text x="1080" y="738" text-anchor="middle" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="24">Wed</text>
  </g>
</svg>
