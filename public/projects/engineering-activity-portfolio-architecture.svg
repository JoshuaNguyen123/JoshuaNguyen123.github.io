<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="engineering-activity-portfolio-title engineering-activity-portfolio-desc">
  <title id="engineering-activity-portfolio-title">Engineering Activity Portfolio architecture</title>
  <desc id="engineering-activity-portfolio-desc">Collectors stay on the machine and reduce tool activity to dates and counts. A publish step writes the public snapshot. The static site reads that snapshot, draws the heatmaps, and polls the published feed for a newer day. Prompts, code, filenames, repositories, and raw IDs never leave the machine.</desc>
