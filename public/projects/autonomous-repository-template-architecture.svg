<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="autonomous-repository-template-title autonomous-repository-template-desc">
  <title id="autonomous-repository-template-title">Autonomous Repository Template architecture</title>
  <desc id="autonomous-repository-template-desc">A repository protocol for coding agents. A human request opens a plan, the plan must pass a planning gate before implementation files change, and the work must clear its verification lane. Project memory is ordinary tracked files, so later agents and later protocol versions read the same state.</desc>
