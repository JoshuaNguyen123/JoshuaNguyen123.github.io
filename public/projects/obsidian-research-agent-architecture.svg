<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="ora-title ora-desc">
  <title id="ora-title">Obsidian Research Agent architecture</title>
  <desc id="ora-desc">A vertical research loop: mission console reads vault context, builds a durable plan, passes an approval gate with preview then grant, runs sandboxed tools, and writes notes plus receipts for replay. Companion service, Linear, and GitHub sit on a gated side rail off the default path.</desc>

  <rect width="1200" height="900" fill="#f5f3ed"/>

  <text x="56" y="52" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3">01  BOUNDED LOOP</text>
  <text x="56" y="82" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="26">Research mission · vault in, receipt out</text>

  <!-- Main loop lane label -->
  <text x="56" y="118" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="2">DEFAULT PATH</text>
  <line x1="168" y1="114" x2="760" y2="114" stroke="#8a5a20" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Side rail label -->
  <text x="820" y="118" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="2">GATED SIDE RAIL</text>
  <line x1="960" y1="114" x2="1144" y2="114" stroke="#6b6455" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== MAIN LOOP: 6 stacked stages ===== -->

  <!-- 1 Mission console -->
  <rect x="56" y="132" width="704" height="92" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <rect x="56" y="132" width="44" height="92" fill="#16130e"/>
  <text x="78" y="186" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">1</text>
  <text x="118" y="168" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">Mission console</text>
  <text x="118" y="196" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="15">Desktop Obsidian plugin · side console starts the run · operator-facing</text>

  <path d="M408 224 v14" fill="none" stroke="#6b6455" stroke-width="2"/>
  <polygon points="408,246 402,236 414,236" fill="#6b6455"/>

  <!-- 2 Vault context -->
  <rect x="56" y="250" width="704" height="92" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <rect x="56" y="250" width="44" height="92" fill="#16130e"/>
  <text x="78" y="304" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">2</text>
  <text x="118" y="286" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">Vault context read</text>
  <text x="118" y="314" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="15">Existing notes and links become the mission’s grounding · no silent context</text>

  <path d="M408 342 v14" fill="none" stroke="#6b6455" stroke-width="2"/>
  <polygon points="408,364 402,354 414,354" fill="#6b6455"/>

  <!-- 3 Durable plan -->
  <rect x="56" y="368" width="704" height="92" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <rect x="56" y="368" width="44" height="92" fill="#16130e"/>
  <text x="78" y="422" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">3</text>
  <text x="118" y="404" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">Durable plan</text>
  <text x="118" y="432" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="15">Plan the rest of the run must follow · recoverable if a later step fails</text>

  <path d="M408 460 v14" fill="none" stroke="#6b6455" stroke-width="2"/>
  <polygon points="408,482 402,472 414,472" fill="#6b6455"/>

  <!-- 4 Approval gate (accent) -->
  <rect x="56" y="486" width="704" height="100" fill="#fffdf8" stroke="#8a5a20" stroke-width="2.5"/>
  <rect x="56" y="486" width="44" height="100" fill="#8a5a20"/>
  <text x="78" y="544" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">4</text>
  <text x="118" y="522" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22">Approval gate</text>
  <text x="118" y="550" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="15">Preview the exact call · then grant · tools stay bounded and debuggable</text>
  <!-- mini two-step annotation -->
  <rect x="560" y="508" width="86" height="28" fill="#f5f3ed" stroke="#8a5a20" stroke-width="1.5"/>
  <text x="603" y="527" text-anchor="middle" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="13">preview</text>
  <path d="M646 522 h18" fill="none" stroke="#8a5a20" stroke-width="1.5"/>
  <polygon points="670,522 662,518 662,526" fill="#8a5a20"/>
  <rect x="674" y="508" width="70" height="28" fill="#f5f3ed" stroke="#8a5a20" stroke-width="1.5"/>
  <text x="709" y="527" text-anchor="middle" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="13">grant</text>

  <path d="M408 586 v14" fill="none" stroke="#6b6455" stroke-width="2"/>
  <polygon points="408,608 402,598 414,598" fill="#6b6455"/>

  <!-- 5 Sandboxed tools -->
  <rect x="56" y="612" width="340" height="118" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <rect x="56" y="612" width="44" height="118" fill="#16130e"/>
  <text x="78" y="676" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">5</text>
  <text x="118" y="648" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="20">Sandboxed tools</text>
  <text x="118" y="676" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Approved calls only</text>
  <text x="118" y="698" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Bounded code workspace</text>
  <text x="118" y="720" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">No default extra authority</text>

  <path d="M396 671 h18" fill="none" stroke="#6b6455" stroke-width="2"/>
  <polygon points="422,671 412,665 412,677" fill="#6b6455"/>

  <!-- 6 Notes + receipts -->
  <rect x="426" y="612" width="334" height="118" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
  <rect x="426" y="612" width="44" height="118" fill="#16130e"/>
  <text x="448" y="676" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="20">6</text>
  <text x="488" y="648" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="20">Notes + receipts</text>
  <text x="488" y="676" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Sourced notes write back</text>
  <text x="488" y="698" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Receipt per step · replay</text>
  <text x="488" y="720" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Truthful when a page fails</text>

  <!-- Loop-back annotation -->
  <path d="M760 671 h28 v-500 h-28" fill="none" stroke="#8a5a20" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="798" y="420" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="12" transform="rotate(90 798 420)">replay / recover</text>

  <!-- ===== SIDE RAIL ===== -->
  <rect x="820" y="132" width="324" height="598" fill="#fffdf8" stroke="#6b6455" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="842" y="168" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="18">Not the default path</text>
  <text x="842" y="192" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">Capability gates required.</text>
  <text x="842" y="212" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">A research run does not</text>
  <text x="842" y="232" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">inherit these by starting.</text>

  <line x1="842" y1="252" x2="1124" y2="252" stroke="#e0d9cc" stroke-width="1"/>

  <!-- Companion -->
  <rect x="842" y="272" width="280" height="88" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="858" y="302" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="17">Companion service</text>
  <text x="858" y="328" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Local · optional host</text>
  <text x="858" y="348" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Behind a capability gate</text>

  <!-- Linear -->
  <rect x="842" y="380" width="280" height="88" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="858" y="410" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="17">Linear</text>
  <text x="858" y="436" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Issue sync · gated only</text>
  <text x="858" y="456" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Never auto-enabled</text>

  <!-- GitHub -->
  <rect x="842" y="488" width="280" height="88" fill="#f5f3ed" stroke="#16130e" stroke-width="1.5"/>
  <text x="858" y="518" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="17">GitHub</text>
  <text x="858" y="544" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Repo tools · gated only</text>
  <text x="858" y="564" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Same approval discipline</text>

  <text x="842" y="620" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="13">Constraint</text>
  <text x="842" y="644" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Integrations stay off the</text>
  <text x="842" y="664" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">default research path.</text>
  <text x="842" y="684" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">Authority is granted, not</text>
  <text x="842" y="704" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="13">assumed from the mission.</text>

  <!-- Dashed connectors from gate to side rail -->
  <path d="M760 536 h60" fill="none" stroke="#6b6455" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="768" y="528" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="11">opt-in</text>

  <!-- Footer -->
  <line x1="56" y1="760" x2="1144" y2="760" stroke="#e0d9cc" stroke-width="1"/>
  <text x="56" y="798" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="18">Adding tools is easy. The hard part is making each one bounded,</text>
  <text x="56" y="828" fill="#736b5a" font-family="Georgia, 'Times New Roman', serif" font-size="18">previewable, and recoverable — with a receipt that stays truthful.</text>
</svg>
