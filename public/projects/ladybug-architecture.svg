<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="lb-title lb-desc">
  <title id="lb-title">Ladybug</title>
  <desc id="lb-desc">Two phones side by side showing the same private photo and a short handwritten note. A realtime thread keeps the pair in sync. Three small host skins sit under the devices: a dual-phone simulator, a Supabase PWA as the primary host, and the original native SwiftUI app. A lock marks the space as two people, not a network.</desc>

  <rect width="1200" height="900" fill="#f5f3ed"/>
  <ellipse cx="600" cy="724" rx="460" ry="28" fill="#e0d9cc"/>

  <!-- Pair badge -->
  <g transform="translate(600 72)">
    <rect x="-40" y="-22" width="80" height="44" rx="22" fill="#16130e"/>
    <rect x="-22" y="-3" width="15" height="12" rx="2" fill="#fffdf8"/>
    <path d="M-20 -3 v-6 a5.5 5.5 0 0 1 11 0 v6" fill="none" stroke="#fffdf8" stroke-width="2"/>
    <text x="14" y="8" text-anchor="middle" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="22">2</text>
  </g>
  <g transform="translate(674 72)" aria-hidden="true">
    <ellipse cx="-6" cy="3" rx="8" ry="10" fill="#d55e00"/>
    <ellipse cx="6" cy="3" rx="8" ry="10" fill="#d55e00"/>
    <line x1="0" y1="-7" x2="0" y2="13" stroke="#16130e" stroke-width="1.6"/>
    <circle cx="0" cy="-10" r="4.5" fill="#16130e"/>
    <circle cx="-5" cy="1" r="1.5" fill="#16130e"/>
    <circle cx="5" cy="5" r="1.5" fill="#16130e"/>
  </g>

  <!-- LEFT PHONE -->
  <g id="lb-phone-left">
    <rect x="176" y="104" width="334" height="620" rx="46" fill="#16130e"/>
    <rect x="190" y="118" width="306" height="592" rx="36" fill="#fffdf8"/>
    <circle cx="328" cy="138" r="4" fill="#16130e"/>
    <circle cx="348" cy="138" r="4" fill="#16130e"/>
    <circle cx="368" cy="138" r="4" fill="#6b6455"/>
    <circle cx="220" cy="174" r="13" fill="#8a5a20"/>
    <circle cx="242" cy="174" r="13" fill="#3a352c"/>
    <rect x="264" y="164" width="13" height="15" rx="2" fill="#16130e"/>
    <path d="M266 164 v-5 a4.5 4.5 0 0 1 9 0 v5" fill="none" stroke="#16130e" stroke-width="1.7"/>

    <!-- Shared photo: evening table, two cups -->
    <rect x="208" y="200" width="270" height="274" fill="#3a352c"/>
    <rect x="208" y="200" width="270" height="118" fill="#e0d9cc"/>
    <circle cx="292" cy="244" r="24" fill="#8a5a20"/>
    <rect x="208" y="318" width="270" height="10" fill="#16130e"/>
    <ellipse cx="278" cy="430" rx="28" ry="8" fill="#e0d9cc"/>
    <ellipse cx="278" cy="392" rx="20" ry="9" fill="#fffdf8"/>
    <path d="M258 392 v28 a20 8 0 0 0 40 0 v-28" fill="#fffdf8"/>
    <path d="M298 400 a12 12 0 0 1 0 20" fill="none" stroke="#fffdf8" stroke-width="4"/>
    <ellipse cx="368" cy="430" rx="28" ry="8" fill="#8a5a20"/>
    <ellipse cx="368" cy="392" rx="20" ry="9" fill="#8a5a20"/>
    <path d="M348 392 v28 a20 8 0 0 0 40 0 v-28" fill="#8a5a20"/>
    <path d="M388 400 a12 12 0 0 1 0 20" fill="none" stroke="#8a5a20" stroke-width="4"/>

    <text x="220" y="518" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">left the light on</text>
    <text x="220" y="550" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="16">Tuesday · for you</text>
    <rect x="328" y="682" width="58" height="6" rx="3" fill="#16130e"/>
  </g>

  <!-- RIGHT PHONE — same space -->
  <g id="lb-phone-right">
    <rect x="690" y="104" width="334" height="620" rx="46" fill="#16130e"/>
    <rect x="704" y="118" width="306" height="592" rx="36" fill="#fffdf8"/>
    <circle cx="842" cy="138" r="4" fill="#16130e"/>
    <circle cx="862" cy="138" r="4" fill="#16130e"/>
    <circle cx="882" cy="138" r="4" fill="#6b6455"/>
    <circle cx="734" cy="174" r="13" fill="#8a5a20"/>
    <circle cx="756" cy="174" r="13" fill="#3a352c"/>
    <rect x="778" y="164" width="13" height="15" rx="2" fill="#16130e"/>
    <path d="M780 164 v-5 a4.5 4.5 0 0 1 9 0 v5" fill="none" stroke="#16130e" stroke-width="1.7"/>

    <rect x="722" y="200" width="270" height="274" fill="#3a352c"/>
    <rect x="722" y="200" width="270" height="118" fill="#e0d9cc"/>
    <circle cx="806" cy="244" r="24" fill="#8a5a20"/>
    <rect x="722" y="318" width="270" height="10" fill="#16130e"/>
    <ellipse cx="792" cy="430" rx="28" ry="8" fill="#e0d9cc"/>
    <ellipse cx="792" cy="392" rx="20" ry="9" fill="#fffdf8"/>
    <path d="M772 392 v28 a20 8 0 0 0 40 0 v-28" fill="#fffdf8"/>
    <path d="M812 400 a12 12 0 0 1 0 20" fill="none" stroke="#fffdf8" stroke-width="4"/>
    <ellipse cx="882" cy="430" rx="28" ry="8" fill="#8a5a20"/>
    <ellipse cx="882" cy="392" rx="20" ry="9" fill="#8a5a20"/>
    <path d="M862 392 v28 a20 8 0 0 0 40 0 v-28" fill="#8a5a20"/>
    <path d="M902 400 a12 12 0 0 1 0 20" fill="none" stroke="#8a5a20" stroke-width="4"/>

    <text x="734" y="518" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">left the light on</text>
    <text x="734" y="550" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="16">Tuesday · for you</text>
    <rect x="842" y="682" width="58" height="6" rx="3" fill="#16130e"/>
  </g>

  <!-- Realtime thread between the two screens -->
  <path d="M510 336 H690" fill="none" stroke="#8a5a20" stroke-width="4"/>
  <circle cx="510" cy="336" r="7" fill="#8a5a20"/>
  <circle cx="690" cy="336" r="7" fill="#8a5a20"/>
  <circle cx="600" cy="336" r="12" fill="#8a5a20"/>
  <circle cx="600" cy="336" r="5" fill="#fffdf8"/>
  <text x="600" y="372" text-anchor="middle" fill="#8a5a20" font-family="Georgia, 'Times New Roman', serif" font-size="18">realtime</text>

  <!-- Three host skins -->
  <g id="lb-hosts">
    <rect x="168" y="768" width="248" height="96" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
    <rect x="188" y="786" width="34" height="58" rx="6" fill="none" stroke="#16130e" stroke-width="2"/>
    <rect x="230" y="786" width="34" height="58" rx="6" fill="none" stroke="#16130e" stroke-width="2"/>
    <text x="280" y="814" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="20">Simulator</text>
    <text x="280" y="840" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">no credentials</text>

    <rect x="436" y="760" width="328" height="112" fill="#8a5a20"/>
    <rect x="456" y="782" width="70" height="50" rx="4" fill="#fffdf8"/>
    <rect x="464" y="790" width="54" height="7" fill="#e0d9cc"/>
    <rect x="464" y="804" width="38" height="18" fill="#e0d9cc"/>
    <text x="544" y="808" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="22">PWA</text>
    <text x="544" y="836" fill="#fffdf8" font-family="Georgia, 'Times New Roman', serif" font-size="15">primary · RLS · live</text>

    <rect x="784" y="768" width="248" height="96" fill="#fffdf8" stroke="#16130e" stroke-width="2"/>
    <rect x="804" y="786" width="34" height="58" rx="6" fill="#16130e"/>
    <rect x="812" y="792" width="18" height="4" rx="2" fill="#fffdf8"/>
    <text x="854" y="814" fill="#16130e" font-family="Georgia, 'Times New Roman', serif" font-size="20">Native</text>
    <text x="854" y="840" fill="#6b6455" font-family="Georgia, 'Times New Roman', serif" font-size="14">SwiftUI · earlier</text>
  </g>
</svg>
